+MapsToCook=(FilePath="/Engine/Maps/Entry")
; The Fab effect packs (docs/VFX.md) each bring showroom levels that refer to everything in the pack: 1.7 GB if cooked.
; The game loads effects by path from code, so only those and what they need are cooked. Two more showroom levels sit
; beside assets and cannot be named by folder (MixedVFX/SceneAssets/DemoMap, NiagaraExamples/GalleryLevel): they stay
; out because MapsToCook above names the only level to cook. Check the size of the .ucas after packaging.
+DirectoriesToNeverCook=(Path="/Game/FreeStylizedLaserBeamVFX/Maps")
+DirectoriesToNeverCook=(Path="/Game/PotaVFX_Smoke/Maps")
+DirectoriesToNeverCook=(Path="/Game/Vefects/Easy_Impact_Frames/Maps")
