+DirectoriesToNeverCook=(Path="/Game/Vefects/VFX_Distortion/Maps")
+DirectoriesToNeverCook=(Path="/Game/Vefects/VFX_Distortion/Demo/_Extra/Maps")
+DirectoriesToNeverCook=(Path="/Game/Vefects/Zap_VFX/Maps")
+DirectoriesToNeverCook=(Path="/Game/Vefects/Zap_VFX/Demo/_Extra/Maps")

; Needed because the editor AI toolsets pull in the Game Features plugin; without this rule the cook fails.
[/Script/Engine.AssetManagerSettings]
; The particle effects (docs/VFX.md) are loaded by path from code, so nothing tells the cook that they are needed: the
; first package made after they went in had none of them (found by measuring it, 2026-11-13). Every effect named in
; namespace Vx in KSGameMode.cpp is listed here, and tools/check.sh compares the two lists.
; A Niagara effect does not name itself the way the asset manager's own kinds do, so the manager is told to name them
; (without this line the cook stops: "does not match object's real id").
bShouldManagerDetermineTypeAndName=True
